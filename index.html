<style>
:root{--red:#e11d2e;--black:#080808;--dark:#141414;--bg:#f4f4f5;--card:#fff;--muted:#71717a;--line:#e4e4e7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#18181b}.hero{background:linear-gradient(135deg,#050505,#191919);color:#fff;text-align:center;padding:24px 16px 28px;border-bottom:4px solid var(--red)}.brand{font-size:34px;font-weight:900;letter-spacing:2px}.brand span{color:var(--red)}.car{max-width:520px;width:100%;height:180px;margin:5px auto 0;display:block}.hero h1{margin:0;font-size:22px}.slogan{font-size:19px;font-weight:800;margin:8px 0 4px}.contact{font-weight:800;color:#fff}.contact span{color:#ff3345}.wrap{max-width:760px;margin:20px auto;padding:0 14px}.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #00000010;border:1px solid #eee}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px;font-weight:800;margin-bottom:5px}input,select,textarea,button{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}textarea{min-height:90px;resize:vertical}button{background:var(--black);color:#fff;font-weight:800;border:0;cursor:pointer}.red{background:var(--red)}.ghost{background:#eee;color:#18181b}.full{grid-column:1/-1}.msg{margin-top:12px;padding:12px;border-radius:10px}.ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#b91c1c}.admin{display:none}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.topbar button{width:auto;padding:10px 14px}.tablewrap{overflow:auto}.appt{min-width:680px;border-collapse:collapse;width:100%}.appt th,.appt td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.appt th{background:#fafafa}.status{padding:6px 8px;border-radius:999px;font-weight:800;font-size:12px;display:inline-block}.bekliyor{background:#fef3c7;color:#92400e}.onaylandı{background:#dbeafe;color:#1d4ed8}.serviste{background:#ede9fe;color:#6d28d9}.tamamlandı{background:#dcfce7;color:#166534}.iptal{background:#fee2e2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:14px;border-radius:12px;background:#fafafa;border:1px solid var(--line)}.stat b{display:block;font-size:22px}.small{color:var(--muted);font-size:13px}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.car{height:150px}}

.hero{padding:0 0 28px;background:#f4f4f5;border-bottom:4px solid var(--red);color:#fff}
.hero-visual{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;object-position:center}

</style>

<main class="wrap">
<section class="card"><h2>📅 Online Randevu</h2><form id="form"><div class="grid">
<div><label>Ad Soyad</label><input id="name" required></div><div><label>Telefon</label><input id="phone" required></div>
<div><label>Plaka</label><input id="plate" required></div><div><label>Marka / Model</label><input id="vehicle" required></div>
<div><label>Servis İşlemi</label><select id="service" required><option value="">Seçiniz</option><option>Periyodik Bakım</option><option>Arıza Tespiti</option><option>Yağ & Filtre Bakımı</option><option>Fren Sistemi</option><option>Süspansiyon</option><option>Klima</option><option>Diğer</option></select></div>
<div><label>Tarih</label><input id="date" type="date" required></div><div><label>Saat</label><input id="time" type="time" required></div>
<div class="full"><label>Not / Açıklama</label><textarea id="notes" placeholder="Arıza veya özel notunuz..."></textarea></div><div class="full"><button class="red">RANDEVU OLUŞTUR</button></div></div></form><div id="msg"></div></section>
<section class="card"><h2>🔎 Randevu Sorgula</h2><input id="no" placeholder="EYM-20261004-123456"><button id="lookupBtn">SORGULA</button><div id="result"></div></section>
<section class="card"><button class="ghost" id="adminOpen">🔐 Yönetici Girişi</button></section>
<section class="card admin" id="adminBox"><div class="topbar"><h2>🛠️ Yönetim Paneli</h2><button class="ghost" id="logout">Çıkış</button></div><div id="loginArea"><p class="small">Supabase Authentication yöneticisi ile giriş yapın.</p><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button class="red" id="login">GİRİŞ YAP</button><div id="loginMsg"></div></div><div id="dashboard" style="display:none"><div class="stats"><div class="stat">Toplam<b id="sTotal">0</b></div><div class="stat">Bekliyor<b id="sWait">0</b></div><div class="stat">Serviste<b id="sService">0</b></div><div class="stat">Tamamlandı<b id="sDone">0</b></div></div><button class="red" id="refresh">↻ Randevuları Yenile</button><div class="tablewrap"><table class="appt"><thead><tr><th>Randevu</th><th>Müşteri</th><th>Araç</th><th>Tarih/Saat</th><th>İşlem</th><th>Durum</th></tr></thead><tbody id="tbody"></tbody></table></div><div id="dashMsg"></div></div></section>
</main>
<script>
const SUPABASE_URL='https://qoylupixarjcgwtydjrz.supabase.co';
const SUPABASE_KEY='sb_publishable_AQc092rBQ1Rf3CNzRVWzag_olpp42yj';
let accessToken=localStorage.getItem('eymen_access_token')||'';
function headers(auth=true){return {apikey:SUPABASE_KEY,'Content-Type':'application/json',...(auth&&accessToken?{Authorization:'Bearer '+accessToken}:{Authorization:'Bearer '+SUPABASE_KEY})}}
async function rest(path,opt={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{...headers(true),...(opt.headers||{})}});const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
async function auth(path,opt={}){const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{...opt,headers:{...headers(false),...(opt.headers||{})}});const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):{}}
document.getElementById('date').min=new Date().toISOString().slice(0,10);
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.className='msg';m.textContent='Kaydediliyor...';try{const rows=await rest('appointments',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({full_name:name.value.trim(),phone:phone.value.trim(),plate:plate.value.trim().toUpperCase(),vehicle:vehicle.value.trim(),service:service.value,appointment_date:date.value,appointment_time:time.value,notes:notes.value.trim()})});m.className='msg ok';m.innerHTML='✅ Randevunuz oluşturuldu.<br><b>Randevu No: '+(rows[0]?.appointment_no||'oluşturuldu')+'</b>';e.target.reset()}catch(x){m.className='msg err';m.textContent='❌ Randevu kaydedilemedi. '+x.message.slice(0,220)}};
document.getElementById('lookupBtn').onclick=async()=>{const r=document.getElementById('result');r.className='msg';try{const x=await rest('appointments?appointment_no=eq.'+encodeURIComponent(no.value.trim())+'&select=appointment_no,status,appointment_date,appointment_time,service,plate');if(!x.length){r.className='msg err';r.textContent='Randevu bulunamadı.';return}r.className='msg ok';r.innerHTML='<b>'+x[0].appointment_no+'</b><br>Durum: '+(x[0].status||'Bekliyor')+'<br>Tarih: '+x[0].appointment_date+' '+(x[0].appointment_time||'')+'<br>İşlem: '+(x[0].service||'')+'<br>Plaka: '+(x[0].plate||'')}catch(e){r.className='msg err';r.textContent='Sorgu yapılamadı.'}};
document.getElementById('adminOpen').addEventListener('click', function(){const panel=document.getElementById('adminBox');const isHidden=getComputedStyle(panel).display==='none';panel.style.display=isHidden?'block':'none';if(isHidden && accessToken)showDashboard();});
document.getElementById('login').onclick=async()=>{const m=document.getElementById('loginMsg');m.className='msg';m.textContent='Giriş yapılıyor...';try{const x=await auth('token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});accessToken=x.access_token;localStorage.setItem('eymen_access_token',accessToken);m.textContent='';showDashboard()}catch(e){m.className='msg err';m.textContent='❌ Giriş başarısız. E-posta veya şifreyi kontrol edin.'}};
function showDashboard(){document.getElementById('loginArea').style.display='none';document.getElementById('dashboard').style.display='block';loadAppointments()}
document.getElementById('logout').onclick=()=>{accessToken='';localStorage.removeItem('eymen_access_token');document.getElementById('loginArea').style.display='block';document.getElementById('dashboard').style.display='none'};
document.getElementById('refresh').onclick=loadAppointments;
async function loadAppointments(){const tb=document.getElementById('tbody'),msg=document.getElementById('dashMsg');msg.textContent='Randevular yükleniyor...';try{const rows=await rest('appointments?select=*&order=appointment_date.asc,appointment_time.asc');document.getElementById('sTotal').textContent=rows.length;document.getElementById('sWait').textContent=rows.filter(x=>(x.status||'Bekliyor')==='Bekliyor').length;document.getElementById('sService').textContent=rows.filter(x=>x.status==='Serviste').length;document.getElementById('sDone').textContent=rows.filter(x=>x.status==='Tamamlandı').length;tb.innerHTML='';rows.forEach(x=>{const tr=document.createElement('tr');const status=x.status||'Bekliyor';tr.innerHTML='<td><b>'+(x.appointment_no||'-')+'</b></td><td>'+(x.full_name||'-')+'<br><span class="small">'+(x.phone||'')+'</span></td><td>'+(x.plate||'-')+'<br><span class="small">'+(x.vehicle||'')+'</span></td><td>'+(x.appointment_date||'-')+'<br>'+(x.appointment_time||'')+'</td><td>'+(x.service||'-')+'</td><td><select data-id="'+x.id+'"><option>Bekliyor</option><option>Onaylandı</option><option>Serviste</option><option>Tamamlandı</option><option>İptal</option></select></td>';const sel=tr.querySelector('select');sel.value=status;sel.onchange=()=>changeStatus(x.id,sel.value);tb.appendChild(tr)});msg.textContent=rows.length?'':'Henüz randevu yok.'}catch(e){msg.className='msg err';msg.textContent='❌ Randevular okunamadı. Supabase RLS izinlerini kontrol etmeliyiz.'}}
async function changeStatus(id,status){try{await rest('appointments?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status})});loadAppointments()}catch(e){alert('Durum değiştirilemedi. RLS UPDATE politikasını kontrol etmeliyiz.')}}
if(accessToken){document.getElementById('adminBox').style.display='block';showDashboard()}
</script>
</body></html>
